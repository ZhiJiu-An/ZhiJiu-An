<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">安枳杦 — 把大模型做成能交付的产品</title>
  <desc id="hero-desc">极简暗色个人横幅：左侧是安枳杦的身份、主张与技术方向（RAG 检索、参数微调、多 Agent 编排、MCP 工具接入），右侧是检索增强生成链路示意，从 query、search、fetch 到带 [1] 引用的 answer。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="panel-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f141b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- 网格 -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.35">
    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="280" y1="0" x2="280" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="680" y1="0" x2="680" y2="420"/>
    <line x1="880" y1="0" x2="880" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>

  <!-- 顶部强调线 -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- 四角装饰 -->
  <rect x="56" y="56" width="24" height="3" fill="#58a6ff"/><rect x="56" y="56" width="3" height="24" fill="#58a6ff"/>
  <rect x="1120" y="56" width="24" height="3" fill="#3fb950"/><rect x="1141" y="56" width="3" height="24" fill="#3fb950"/>
  <rect x="56" y="361" width="24" height="3" fill="#3fb950"/><rect x="56" y="340" width="3" height="24" fill="#3fb950"/>
  <rect x="1120" y="361" width="24" height="3" fill="#58a6ff"/><rect x="1141" y="340" width="3" height="24" fill="#58a6ff"/>

  <!-- 左侧身份 -->
  <text x="80" y="92" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="18" font-weight="500" fill="#58a6ff" letter-spacing="2.4">LLM APP DEVELOPER</text>

  <text x="78" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="76" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">ZhiJiu</text>

  <text x="80" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#c9d1d9">把大模型做成能交付的产品。</text>

  <text x="80" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#8b949e">RAG 检索 · Agent 编排 · MCP 工具化 · 可溯源输出</text>

  <!-- 标签 -->
  <g font-family="Consolas,'SF Mono','Courier New',monospace" font-size="17" font-weight="500">
    <g transform="translate(80,310)">
      <rect width="74" height="32" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.4"/>
      <text x="37" y="22" text-anchor="middle" fill="#58a6ff">RAG</text>
    </g>
    <g transform="translate(168,310)">
      <rect width="126" height="32" rx="6" fill="none" stroke="#3fb950" stroke-width="1.4"/>
      <text x="63" y="22" text-anchor="middle" fill="#3fb950">LangGraph</text>
    </g>
    <g transform="translate(308,310)">
      <rect width="76" height="32" rx="6" fill="none" stroke="#d2a8ff" stroke-width="1.4"/>
      <text x="38" y="22" text-anchor="middle" fill="#d2a8ff">MCP</text>
    </g>
    <g transform="translate(398,310)">
      <rect width="102" height="32" rx="6" fill="none" stroke="#ffa657" stroke-width="1.4"/>
      <text x="51" y="22" text-anchor="middle" fill="#ffa657">FastAPI</text>
    </g>
  </g>

  <text x="80" y="382" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="15" fill="#6e7681">@ZhiJiu-An · github.com/ZhiJiu-An</text>

  <!-- 右侧：检索链路示意 -->
  <g>
    <rect x="690" y="96" width="430" height="256" rx="10" fill="url(#panel-fill)" stroke="#30363d" stroke-width="1.2"/>

    <circle cx="714" cy="124" r="4" fill="#ff5f56"/>
    <circle cx="730" cy="124" r="4" fill="#ffbd2e"/>
    <circle cx="746" cy="124" r="4" fill="#27c93f"/>
    <text x="766" y="129" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="14" fill="#6e7681">retrieval pipeline</text>

    <line x1="690" y1="146" x2="1120" y2="146" stroke="#30363d" stroke-width="1"/>

    <g font-family="Consolas,'SF Mono','Courier New',monospace" font-size="15">
      <text x="714" y="180" fill="#58a6ff">query</text>
      <text x="802" y="180" fill="#c9d1d9">感冒的病因病机？</text>

      <text x="714" y="222" fill="#3fb950">search</text>
      <text x="802" y="222" fill="#c9d1d9">8 chunks · 320ms</text>

      <text x="714" y="264" fill="#d2a8ff">fetch</text>
      <text x="802" y="264" fill="#c9d1d9">chunk [1] + 上下文</text>

      <text x="714" y="306" fill="#ffa657">answer</text>
      <text x="802" y="306" fill="#c9d1d9">《中医内科学》… [1]</text>
    </g>

    <!-- 可信度角标 -->
    <g transform="translate(1040,206)">
      <rect width="56" height="20" rx="4" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-width="1"/>
      <text x="28" y="14" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="11" text-anchor="middle" fill="#3fb950">high</text>
    </g>

    <line x1="714" y1="326" x2="1096" y2="326" stroke="#21262d" stroke-width="1"/>
    <text x="714" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#6e7681">可信度由服务端计算 · 无依据则拒答</text>
  </g>

  <!-- 圆点装饰 -->
  <circle cx="1042" cy="390" r="3" fill="#58a6ff" opacity="0.3"/>
  <circle cx="1062" cy="385" r="2" fill="#3fb950" opacity="0.3"/>
  <circle cx="1082" cy="392" r="2.5" fill="#d2a8ff" opacity="0.3"/>
</svg>
